# Local operation: keep the API and databases off the LAN and avoid the host PostgreSQL port.
services:
  collector-ingress:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8011:80"
    volumes:
      - ./deploy/collector-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
  db:
    ports: !override
      - "127.0.0.1:55432:5432"
    restart: unless-stopped
  redis:
    ports: !override
      - "127.0.0.1:56379:6379"
    restart: unless-stopped
  app:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  celery-worker:
    restart: unless-stopped
  celery-beat:
    restart: unless-stopped
  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  flower:
    ports: !override
      - "127.0.0.1:5555:5555"

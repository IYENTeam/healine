events {}
http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        client_max_body_size 11m;
        location ~ ^/api/v1/collectors/(pair|batches|observations)$ {
            # Resolve Docker's service name again after a backend replacement.
            set $backend http://app:8000;
            proxy_pass $backend;
            proxy_read_timeout 90s;
            proxy_set_header Host $host;
        }
        location / { return 404; }
    }
}
